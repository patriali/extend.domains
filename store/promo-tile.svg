<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <!-- Chrome Web Store small promo tile (440x280). Brand colours and the mark
       are lifted from src/icons/icon.svg so the tile, the toolbar icon, and the
       sidebar read as one thing. No screenshot content: Chrome rejects tiles
       that are just a shrunken screenshot. -->
  <rect width="440" height="280" fill="#16202E"/>

  <!-- the mark, scaled 128 -> 84 and placed on the optical left third -->
  <g transform="translate(44 98) scale(0.65625)">
    <rect x="0" y="0" width="128" height="128" rx="28" fill="#0F1721"/>
    <rect x="14" y="42" width="100" height="44" rx="13" fill="#FFC233"/>
    <rect x="26" y="56" width="36" height="16" rx="8" fill="#16202E"/>
    <circle cx="73" cy="67" r="5" fill="#16202E"/>
    <rect x="84" y="56" width="18" height="16" rx="8" fill="#16202E"/>
  </g>

  <text x="156" y="132" font-family="Noto Sans, Liberation Sans, sans-serif"
        font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="-0.6">Extend<tspan fill="#FFC233">.</tspan>Domains</text>
  <text x="157" y="163" font-family="Noto Sans, Liberation Sans, sans-serif"
        font-size="16" font-weight="400" fill="#9AA7B8">Highlight a domain. See who owns it.</text>
</svg>
